name: Regenerate client

# Downloads Atlassian's Bitbucket Data Center OpenAPI spec, filters it to the
# pull request API and regenerates internal/bitbucket/client.gen.go. If the
# generated client changed, the result is pushed to a branch and a PR is opened.
on:
  workflow_dispatch:
    inputs:
      spec_version:
        description: "Bitbucket Data Center version of the spec, e.g. 9.4"
        required: true
        default: "9.4"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      SPEC_VERSION: ${{ inputs.spec_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make generate SPEC_VERSION="$SPEC_VERSION"

      - run: make test

      - name: Push branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Generated client is already up to date with the $SPEC_VERSION spec."
            exit 0
          fi
          branch="regenerate/bitbucket-$SPEC_VERSION-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Regenerate client from the Bitbucket $SPEC_VERSION spec"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Regenerate client from the Bitbucket $SPEC_VERSION spec" \
            --body "Generated by the *Regenerate client* workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
          || echo "::warning::Could not open a PR (enable 'Allow GitHub Actions to create pull requests' in the repo settings). The branch $branch was pushed."
