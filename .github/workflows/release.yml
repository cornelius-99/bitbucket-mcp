name: Release

# Run from the Actions tab (or `gh workflow run release.yml -f version=v0.1.2`).
# Tests the chosen commit, then creates the tag and a GitHub Release with
# generated notes. `go install` and mise pick the new tag up from the Go proxy.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag does not exist yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make test

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

      - name: Warm the Go module proxy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          curl -sSf "https://proxy.golang.org/github.com/cornelius-99/bitbucket-mcp/@v/$VERSION.info" || true
