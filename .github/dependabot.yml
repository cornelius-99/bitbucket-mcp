    directory: /
    schedule:
      interval: weekly
    assignees: ["cornelius-99"]
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees: ["cornelius-99"]
    groups:
      github-actions:
        patterns: ["*"]
